<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #E9EEF9; font-family: sans-serif; display: flex; gap: 32px; }
  .tile { width: 220px; height: 220px; background: #FFFFFF; border-radius: 50px; overflow: hidden; position: relative; }
  .tile.round2 { border-radius: 66px; }
  .tile img { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 133px; height: 133px; }
  .label { text-align: center; font-size: 13px; color: #1D2433; margin-top: 10px; }
</style>
</head>
<body>
  <div>
    <div class="tile"><img src="foreground.png" /></div>
    <div class="label">多圆角（约 22%）</div>
  </div>
  <div>
    <div class="tile round2"><img src="foreground.png" /></div>
    <div class="label">更大圆角（约 30%）</div>
  </div>
</body>
</html>
